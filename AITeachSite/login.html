<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 | AIMUP</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head>
<body data-page="login" class="account-page"><div data-site-header></div><main class="auth-shell"><section class="auth-intro"><p class="eyebrow">WELCOME BACK</p><h1>배움의 다음 장을<br>계속하세요.</h1><p>내 강의와 문의 현황을 한곳에서 확인할 수 있습니다.</p></section><section class="auth-panel"><a href="index.html" class="auth-logo"><img src="logo.png" alt="AIMUP"></a><div><p class="overline">MEMBER LOGIN</p><h2>로그인</h2><p>등록한 이메일로 로그인해 주세요.</p></div><form data-auth-form="login"><label>이메일<input type="email" name="email" required autocomplete="email" placeholder="name@example.com"></label><label>비밀번호<input type="password" name="password" required minlength="6" autocomplete="current-password" placeholder="6자 이상"></label><button class="button button-primary" type="submit">로그인</button><p class="form-status" role="status"></p></form><p class="auth-switch">아직 회원이 아니신가요? <a href="signup.html">회원가입</a></p><p class="demo-note">Firebase 설정 전에는 데모 모드로 동작합니다. 대표 이메일로 로그인하면 관리자 화면을 확인할 수 있습니다.</p></section></main><script src="firebase-config.js"></script><script type="module" src="app.js"></script></body></html>
