<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회원가입 | AIMUP</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head>
<body data-page="signup" class="account-page"><div data-site-header></div><main class="auth-shell"><section class="auth-intro signup-art"><p class="eyebrow">START WITH AIMUP</p><h1>AI와 함께<br>더 높이 성장하세요.</h1><p>교육 소식과 맞춤형 프로그램을 가장 먼저 만나보세요.</p></section><section class="auth-panel"><a href="index.html" class="auth-logo"><img src="logo.png" alt="AIMUP"></a><div><p class="overline">CREATE ACCOUNT</p><h2>회원가입</h2><p>기본 정보를 입력해 주세요.</p></div><form data-auth-form="signup"><label>이름<input name="name" required autocomplete="name" placeholder="이름"></label><label>이메일<input type="email" name="email" required autocomplete="email" placeholder="name@example.com"></label><label>비밀번호<input type="password" name="password" required minlength="6" autocomplete="new-password" placeholder="6자 이상"></label><label class="check-label"><input type="checkbox" required><span>이용약관 및 개인정보 처리방침에 동의합니다.</span></label><button class="button button-primary" type="submit">회원가입</button><p class="form-status" role="status"></p></form><p class="auth-switch">이미 회원이신가요? <a href="login.html">로그인</a></p></section></main><script src="firebase-config.js"></script><script type="module" src="app.js"></script></body></html>
